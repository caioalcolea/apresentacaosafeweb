version: "3.7"

services:
## --------------------------- SAFEWEB PRESENTATION --------------------------- ##
  safeweb-presentation:
    image: safeweb-presentation:latest
    working_dir: /app

    networks:
      - talkhub

    environment:
      - PORT=3090
      - HOST=0.0.0.0
      - NODE_ENV=production
      - TZ=America/Sao_Paulo

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.safeweb.rule=Host(`safeweb.talkhub.me`)
        - traefik.http.services.safeweb.loadbalancer.server.port=3090
        - traefik.http.routers.safeweb.service=safeweb
        - traefik.http.routers.safeweb.tls.certresolver=letsencryptresolver
        - traefik.http.routers.safeweb.entrypoints=websecure
        - traefik.http.routers.safeweb.tls=true
## --------------------------- SAFEWEB PRESENTATION --------------------------- ##

networks:
  talkhub:
    name: talkhub
    external: true
