<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="theme-safeweb.css">
</head>
<body class="slide col" style="background: linear-gradient(180deg, #ffffff 0%, #f0f7ff 100%);">

  <!-- Top Bar -->
  <div class="fit row" style="padding: 24px 40px; justify-content: space-between; align-items: center;">
    <img src="assets/safeweb-logo.png" alt="Safeweb" class="logo-safeweb">
    <div class="row gap-8" style="align-items: center;">
      <span style="font-size: 12px; color: var(--text-light);">parceria estratégica</span>
      <div style="background: #660099; padding: 6px 16px; border-radius: 6px;">
        <span style="font-size: 14px; font-weight: 700; color: white;">VIVO</span>
      </div>
    </div>
  </div>

  <!-- Main Content - Centered -->
  <div class="fill col" style="justify-content: center; align-items: center; padding: 0 60px;">

    <!-- Badge -->
    <div class="badge badge-primary" style="margin-bottom: 20px; padding: 6px 16px;">
      <span style="font-size: 11px; letter-spacing: 1px;">CERTIFICAÇÃO DIGITAL ICP-BRASIL</span>
    </div>

    <!-- Main Title -->
    <h1 style="font-size: 56px; color: var(--safeweb-button); font-weight: 700; letter-spacing: -2px; margin: 0 0 16px 0; text-align: center;">
      Assinou? Valeu!
    </h1>

    <!-- Tagline -->
    <p style="font-size: 20px; color: var(--text-medium); margin: 0 0 32px 0; text-align: center; max-width: 600px; line-height: 1.5;">
      Com a Vivo é assim: sua assinatura vale onde você estiver!
    </p>

    <!-- Value Props Row -->
    <div class="row gap-24" style="margin-top: 8px;">
      <div class="col" style="align-items: center; gap: 8px;">
        <div class="icon-circle large" style="background: linear-gradient(135deg, var(--safeweb-primary) 0%, var(--safeweb-dark-blue) 100%); color: white;">
          🔐
        </div>
        <span style="font-size: 12px; color: var(--text-medium); text-align: center;">Validade<br>Jurídica</span>
      </div>
      <div class="col" style="align-items: center; gap: 8px;">
        <div class="icon-circle large" style="background: linear-gradient(135deg, var(--safeweb-primary) 0%, var(--safeweb-dark-blue) 100%); color: white;">
          📱
        </div>
        <span style="font-size: 12px; color: var(--text-medium); text-align: center;">100%<br>Mobile</span>
      </div>
      <div class="col" style="align-items: center; gap: 8px;">
        <div class="icon-circle large" style="background: linear-gradient(135deg, var(--safeweb-primary) 0%, var(--safeweb-dark-blue) 100%); color: white;">
          ⚡
        </div>
        <span style="font-size: 12px; color: var(--text-medium); text-align: center;">Emissão<br>em 5 min</span>
      </div>
      <div class="col" style="align-items: center; gap: 8px;">
        <div class="icon-circle large" style="background: linear-gradient(135deg, var(--safeweb-primary) 0%, var(--safeweb-dark-blue) 100%); color: white;">
          💳
        </div>
        <span style="font-size: 12px; color: var(--text-medium); text-align: center;">Cobrança<br>na Fatura</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="fit slide-footer row" style="justify-content: space-between; align-items: center;">
    <p style="font-size: 10px; color: var(--text-light); margin: 0;">
      Move4 Publicidade • Dezembro 2025
    </p>
    <p style="font-size: 10px; color: var(--text-light); margin: 0;">
      Pitch Estratégico • Safeweb × Vivo
    </p>
  </div>

</body>
</html>
