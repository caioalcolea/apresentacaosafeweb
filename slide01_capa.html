<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="theme-safeweb.css">
</head>
<body class="slide col" style="background: linear-gradient(180deg, #ffffff 0%, #f0f7ff 100%);">

  <!-- Top Bar -->
  <div class="fit row" style="padding: 3vh 5vw; justify-content: space-between; align-items: center;">
    <img src="assets/safeweb-logo.png" alt="Safeweb" class="logo-safeweb">
    <div class="row gap-8" style="align-items: center;">
      <span class="text-sm text-light">parceria estratégica</span>
      <div style="background: #660099; padding: 0.8vh 2vw; border-radius: 6px;">
        <span class="text-base font-bold text-white">VIVO</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="fill col" style="justify-content: center; align-items: center; padding: 0 10vw;">

    <!-- Badge -->
    <div class="badge badge-primary" style="margin-bottom: 3vh;">
      <span style="letter-spacing: 2px;">CERTIFICAÇÃO DIGITAL ICP-BRASIL</span>
    </div>

    <!-- Main Title -->
    <h1 class="text-3xl font-bold text-center" style="color: var(--safeweb-button); letter-spacing: -1px; margin-bottom: 2vh;">
      Assinou? Valeu!
    </h1>

    <!-- Tagline -->
    <p class="text-lg text-medium text-center" style="max-width: 600px; margin-bottom: 5vh;">
      Certificação digital para 33 milhões de brasileiros
    </p>

    <!-- Value Props -->
    <div class="row" style="gap: 4vw;">
      <div class="col" style="align-items: center; gap: 1vh;">
        <div class="icon-circle large" style="background: linear-gradient(135deg, var(--safeweb-primary), var(--safeweb-dark-blue)); color: white;">🔐</div>
        <span class="text-sm text-medium text-center">Validade Jurídica</span>
      </div>
      <div class="col" style="align-items: center; gap: 1vh;">
        <div class="icon-circle large" style="background: linear-gradient(135deg, var(--safeweb-primary), var(--safeweb-dark-blue)); color: white;">📱</div>
        <span class="text-sm text-medium text-center">100% Mobile</span>
      </div>
      <div class="col" style="align-items: center; gap: 1vh;">
        <div class="icon-circle large" style="background: linear-gradient(135deg, var(--safeweb-primary), var(--safeweb-dark-blue)); color: white;">⚡</div>
        <span class="text-sm text-medium text-center">Emissão 5 min</span>
      </div>
      <div class="col" style="align-items: center; gap: 1vh;">
        <div class="icon-circle large" style="background: linear-gradient(135deg, var(--safeweb-primary), var(--safeweb-dark-blue)); color: white;">💳</div>
        <span class="text-sm text-medium text-center">Na Fatura</span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="fit slide-footer row" style="justify-content: space-between; align-items: center;">
    <p>Move4 Publicidade • Dezembro 2025</p>
    <p>Pitch Estratégico • Safeweb × Vivo</p>
  </div>

</body>
</html>
